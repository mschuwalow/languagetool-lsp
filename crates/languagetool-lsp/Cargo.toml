[package]
name = "languagetool-lsp"
version = "0.1.2"
edition = "2021"
authors = ["Maxim Schuwalow"]
description = "LanguageTool language server for editors."
license = "MIT"

[[bin]]
name = "languagetool-lsp"
path = "src/main.rs"

[lib]
name = "languagetool_lsp"
path = "src/lib.rs"

[dependencies]
languagetool-client = { path = "../languagetool-client", default-features = false, features = ["rustls"] }

clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tower-lsp = "0.20"
urlencoding = "2"

[dev-dependencies]
httpmock = "0.8"
pretty_assertions = "1"
tempfile = "3"
indoc = "2"
