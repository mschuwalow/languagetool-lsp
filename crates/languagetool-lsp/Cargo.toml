[package]
name = "languagetool-lsp"
version = "0.2.0"
edition = "2021"
authors = ["Maxim Schuwalow"]
description = "LanguageTool language server for editors."
license = "MIT"

[[bin]]
name = "languagetool-lsp"
path = "src/main.rs"

[lib]
name = "languagetool_lsp"
path = "src/lib.rs"

[dependencies]
languagetool-client = { path = "../languagetool-client", default-features = false, features = ["rustls"] }

clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
tower-lsp-server = "0.23"
tree-sitter = "0.25"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-md-025 = { version = "0.5.6", features = ["parser"] }
tree-sitter-nix = "0.3.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-scala = "0.26.0"
tree-sitter-typescript = "0.23.2"
urlencoding = "2"

[dev-dependencies]
httpmock = "0.8"
tempfile = "3"
indoc = "2"
