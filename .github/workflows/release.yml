name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      languagetool:
        image: erikvl87/languagetool:latest
        ports:
          - 8081:8010
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cmd-format: nix develop -c {0}

      - name: Run CI checks
        run: nix develop -c cargo make ci

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Read release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version="${VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version ${version} is not a supported semver release version" >&2
            exit 1
          fi
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump versions, commit, tag, and push
        run: >-
          nix develop -c cargo release "${{ steps.version.outputs.version }}"
          --workspace
          --execute
          --no-confirm
          --no-publish
          --no-verify
          --tag-name "${{ steps.version.outputs.tag }}"
          --allow-branch main

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

  build-assets:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: languagetool-lsp-x86_64-unknown-linux-musl.tar.gz
            toolchain: nix
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: languagetool-lsp-x86_64-apple-darwin.tar.gz
            toolchain: nix
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: languagetool-lsp-aarch64-apple-darwin.tar.gz
            toolchain: nix
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: languagetool-lsp-x86_64-pc-windows-msvc.zip
            toolchain: rustup
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}

      - name: Install Nix
        if: matrix.toolchain == 'nix'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Rust (rustup)
        if: matrix.toolchain == 'rustup'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cmd-format: ${{ matrix.toolchain == 'nix' && 'nix develop -c {0}' || '{0}' }}

      - name: Setup Python (rustup)
        if: matrix.toolchain == 'rustup'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Configure toolchain wrapper
        shell: bash
        run: |
          if [ "${{ matrix.toolchain }}" = "nix" ]; then
            printf '%s\n' '#!/usr/bin/env bash' 'exec nix develop -c "$@"' > with-toolchain.sh
          else
            printf '%s\n' '#!/usr/bin/env bash' 'exec "$@"' > with-toolchain.sh
          fi
          chmod +x with-toolchain.sh

      - name: Build binary
        shell: bash
        run: ./with-toolchain.sh cargo build -p languagetool-lsp --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          ./with-toolchain.sh python <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          asset = os.environ["ASSET"]
          binary_name = "languagetool-lsp.exe" if "windows" in target else "languagetool-lsp"
          binary = Path("target") / target / "release" / binary_name

          if asset.endswith(".zip"):
              with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, binary_name)
          else:
              with tarfile.open(asset, "w:gz") as archive:
                  archive.add(binary, arcname=binary_name)
          PY

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ matrix.asset }}
