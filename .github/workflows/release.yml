name: Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      languagetool:
        image: languagetool/languagetool:latest
        ports:
          - 8081:8010
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      - name: Wait for LanguageTool
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8081/v2/languages >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "LanguageTool did not become ready" >&2
          exit 1

      - name: Run CI checks
        run: cargo make ci

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read release version
        id: version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a supported semver release tag" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tag="${GITHUB_REF_NAME}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Install cargo-release
        run: cargo install cargo-release --locked

      - name: Patch workspace crate versions
        run: cargo release version "${{ steps.version.outputs.version }}" --workspace --execute --no-confirm --allow-branch 'main'

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: |
            Cargo.lock
            Cargo.toml
            Makefile.toml
            openapi/**
            openapitools.json
            crates/**

  build-assets:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: languagetool-lsp-x86_64-unknown-linux-musl.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: languagetool-lsp-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: languagetool-lsp-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: languagetool-lsp-x86_64-pc-windows-msvc.zip
    steps:
      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: release-source
          path: .

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build binary
        run: cargo build -p languagetool-lsp --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          python <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          asset = os.environ["ASSET"]
          binary_name = "languagetool-lsp.exe" if "windows" in target else "languagetool-lsp"
          binary = Path("target") / target / "release" / binary_name

          if asset.endswith(".zip"):
              with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, binary_name)
          else:
              with tarfile.open(asset, "w:gz") as archive:
                  archive.add(binary, arcname=binary_name)
          PY

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ matrix.asset }}
