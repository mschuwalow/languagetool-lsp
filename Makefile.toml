[config]
default_to_workspace = false

[env]
OPENAPI_GENERATOR_CLI_VERSION = "2.34.0"
OPENAPI_SOURCE = "openapi/languagetool-swagger.json"
OPENAPI_NORMALIZED = "target/openapi/languagetool-swagger-urlencoded.json"
LANGUAGETOOL_CLIENT_DIR = "crates/languagetool-client"

[tasks.check]
description = "Run the standard workspace verification checks."
dependencies = ["check-rustfmt", "check-clippy"]

[tasks.check-rustfmt]
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.check-clippy]
command = "cargo"
args = ["clippy", "--workspace", "--all-targets", "--no-deps", "--", "-D", "warnings"]

[tasks.ci]
description = "Run generated-code consistency checks, linting, and tests."
dependencies = ["check-generated-client", "check", "test"]

[tasks.fix]
description = "Runs rustfmt and clippy checks and applies fixes"
dependencies = ["fix-clippy", "fix-rustfmt"]

[tasks.fix-rustfmt]
description = "Runs rustfmt checks and applies fixes"
install_crate = "rustfmt"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fix-clippy]
description = "Runs clippy checks and applies fixes"
install_crate = "clippy"
command = "cargo"
args = [
    "clippy",
    "--workspace",
    "--all-targets",
    "--no-deps",
    "--fix",
    "--allow-dirty",
    "--allow-staged",
    "--",
    "-D",
    "warnings",
]

[tasks.test]
command = "cargo"
args = ["test", "--workspace"]

[tasks.check-generated-client]
description = "Regenerate the checked-in client and fail if it differs from the repository."
dependencies = ["generate-client"]
script_runner = "@shell"
script = '''
git diff --exit-code -- crates/languagetool-client Cargo.lock
'''

[tasks.normalize-openapi]
description = "Create the urlencoded Swagger document consumed by OpenAPI Generator."
script_runner = "@shell"
script = '''
mkdir -p "$(dirname "${OPENAPI_NORMALIZED}")"

node <<'NODE'
const fs = require("fs");
const path = require("path");

const source = process.env.OPENAPI_SOURCE;
const destination = process.env.OPENAPI_NORMALIZED;
const spec = JSON.parse(fs.readFileSync(source, "utf8"));
const consumes = ["application/x-www-form-urlencoded"];

spec.consumes = consumes;
for (const pathItem of Object.values(spec.paths ?? {})) {
  for (const operation of Object.values(pathItem ?? {})) {
    if (operation && typeof operation === "object" && Array.isArray(operation.parameters)) {
      operation.consumes = consumes;
    }
  }
}

fs.mkdirSync(path.dirname(destination), { recursive: true });
fs.writeFileSync(destination, `${JSON.stringify(spec, null, 2)}\n`);
NODE
'''

[tasks.generate-client]
description = "Regenerate the checked-in LanguageTool API client crate."
dependencies = ["normalize-openapi"]
script_runner = "@shell"
script = '''
CLIENT_VERSION="$(node <<'NODE'
const fs = require("fs");
const manifest = `${process.env.LANGUAGETOOL_CLIENT_DIR}/Cargo.toml`;
if (!fs.existsSync(manifest)) {
  console.log("0.1.0");
  process.exit(0);
}
const content = fs.readFileSync(manifest, "utf8");
const version = content.match(/^version\s*=\s*"([^"]+)"/m)?.[1] ?? "0.1.0";
console.log(version);
NODE
)"

rm -rf "${LANGUAGETOOL_CLIENT_DIR}"

npx --yes "@openapitools/openapi-generator-cli@${OPENAPI_GENERATOR_CLI_VERSION}" generate \
  -g rust \
  -i "${OPENAPI_NORMALIZED}" \
  -o "${LANGUAGETOOL_CLIENT_DIR}" \
  --additional-properties=packageName=languagetool-client,packageVersion=${CLIENT_VERSION},supportMiddleware=false \
  --global-property=apiDocs=false,modelDocs=false,apiTests=false,modelTests=false

rm -rf \
  "${LANGUAGETOOL_CLIENT_DIR}/docs" \
  "${LANGUAGETOOL_CLIENT_DIR}/.openapi-generator" \
  "${LANGUAGETOOL_CLIENT_DIR}/.openapi-generator-ignore" \
  "${LANGUAGETOOL_CLIENT_DIR}/.gitignore" \
  "${LANGUAGETOOL_CLIENT_DIR}/.travis.yml" \
  "${LANGUAGETOOL_CLIENT_DIR}/git_push.sh" \
  "${LANGUAGETOOL_CLIENT_DIR}/README.md"

node <<'NODE'
const fs = require("fs");
const lib = `${process.env.LANGUAGETOOL_CLIENT_DIR}/src/lib.rs`;
let content = fs.readFileSync(lib, "utf8");
content = content.replace("#![allow(clippy::too_many_arguments)]", "#![allow(clippy::all)]");
fs.writeFileSync(lib, content);
NODE

cargo fmt -p languagetool-client
'''
